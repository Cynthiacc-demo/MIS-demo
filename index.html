<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>資管系器材借用系統</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="hero">
    <h1>資管系器材借用系統</h1>
    <p>提供資管系師生借用教學與活動所需的器材。</p>
  </header>

  <main>
    <section>
      <h2>可借用器材</h2>
      <ul class="equipment-list">
        <li class="card">
          <h3>相機</h3>
          <p>適合拍攝活動紀錄、專題成果與宣傳照片。</p>
        </li>
        <li class="card">
          <h3>投影機</h3>
          <p>適合課堂報告、討論會議與活動放映。</p>
        </li>
        <li class="card">
          <h3>麥克風</h3>
          <p>適合演講、座談與活動主持時擴音使用。</p>
        </li>
        <li class="card">
          <h3>腳架</h3>
          <p>適合搭配相機拍攝，讓畫面更穩定。</p>
        </li>
      </ul>
    </section>

    <section>
      <h2>借用規則</h2>
      <ul class="rules">
        <li>每次最長可借用 7 天。</li>
        <li>請至系辦辦理借用手續。</li>
        <li>器材如有損壞，請務必告知系辦。</li>
        <li>逾期未歸還者，將停權一個月。</li>
      </ul>
    </section>
  </main>

  <footer>
    <p>線上查詢器材狀態功能即將推出</p>
  </footer>

  <!-- 之後的 JavaScript 請寫在這裡 -->
</body>
</html>
